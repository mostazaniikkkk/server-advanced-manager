[versions]
junit = "5.11.3"
assertj = "3.26.3"
jqwik = "1.9.1"
bouncycastle = "1.79"
# Gson lo provee Minecraft en tiempo de ejecución; verificar la versión de 1.21.1 al montar Fabric
gson = "2.10.1"
pitestCore = "1.17.0"
pitestJunit5 = "1.2.1"
pitestGradle = "1.15.0"
jacoco = "0.8.12"

[plugins]
pitest = { id = "info.solidsoft.pitest", version.ref = "pitestGradle" }

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
jqwik = { module = "net.jqwik:jqwik", version.ref = "jqwik" }
bouncycastle-prov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
