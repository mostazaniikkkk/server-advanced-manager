[versions]
# Fabric: misma combinación que ya funciona en esta máquina (proyecto soulsmode), con Loom fijo en lugar de SNAPSHOT
minecraft = "1.21.1"
fabricLoader = "0.20.1"
fabricApi = "0.116.17+1.21.1"
loom = "1.19.3"
# Minecraft 1.21.1 trae Netty 4.1.97 sin netty-codec-http: se embebe la misma versión
netty = "4.1.97.Final"
# netty-codec-http va embebido en sam-server: la última 4.1.x con los arreglos de seguridad (H-18). Solo usa clases del
# núcleo 4.1.97 de Minecraft (auditado: lo único nuevo es ZstdDecoder en HttpContentDecompressor, que SAM no usa)
nettyHttp = "4.1.140.Final"
junit = "5.11.3"
assertj = "3.26.3"
jqwik = "1.9.1"
# Sistema de archivos en memoria (POSIX y ACL) para probar permisos del .env sin depender del SO
jimfs = "1.3.0"
bouncycastle = "1.86"
# Gson lo provee Minecraft en tiempo de ejecución; verificar la versión de 1.21.1 al montar Fabric
gson = "2.15.0"
# Gradle corre sobre JDK 25 (lo exige Loom 1.19): JaCoCo y PIT en versiones con soporte de Java 25
pitestCore = "1.30.1"
pitestJunit5 = "1.2.3"
pitestGradle = "1.19.0"
jacoco = "0.8.16"
# Validación del ID token de Google (RS-OAUTH-05): solo en el servidor
nimbusJoseJwt = "10.10"
# 0.3.2: todas sus referencias a Minecraft existen en 1.21.1. La 0.3.3 llama a un método de 1.21.2+
# (NoSuchMethodError al pedir una meta) aunque su fabric.mod.json no lo declara; la 0.4.x exige 1.21.6.
fabricPermissionsApi = "0.3.2"
# QR del 2FA en el cliente (MIT, sin dependencias)
qrcodegen = "1.8.0"
# Lua 5.2 en Java (CC: Tweaked), con interrupción: scripts de SAM (RS-LUA-01)
cobalt = "0.9.9"

[plugins]
pitest = { id = "info.solidsoft.pitest", version.ref = "pitestGradle" }
loom = { id = "net.fabricmc.fabric-loom-remap", version.ref = "loom" }

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
jqwik = { module = "net.jqwik:jqwik", version.ref = "jqwik" }
jimfs = { module = "com.google.jimfs:jimfs", version.ref = "jimfs" }
bouncycastle-prov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
bouncycastle-pkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }
bouncycastle-util = { module = "org.bouncycastle:bcutil-jdk18on", version.ref = "bouncycastle" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabricLoader" }
fabric-api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabricApi" }
netty-codec-http = { module = "io.netty:netty-codec-http", version.ref = "nettyHttp" }
netty-codec = { module = "io.netty:netty-codec", version.ref = "netty" }
netty-transport = { module = "io.netty:netty-transport", version.ref = "netty" }
netty-buffer = { module = "io.netty:netty-buffer", version.ref = "netty" }
netty-handler = { module = "io.netty:netty-handler", version.ref = "netty" }
nimbus-jose-jwt = { module = "com.nimbusds:nimbus-jose-jwt", version.ref = "nimbusJoseJwt" }
fabric-permissions-api = { module = "me.lucko:fabric-permissions-api", version.ref = "fabricPermissionsApi" }
qrcodegen = { module = "io.nayuki:qrcodegen", version.ref = "qrcodegen" }
cobalt = { module = "cc.tweaked:cobalt", version.ref = "cobalt" }
