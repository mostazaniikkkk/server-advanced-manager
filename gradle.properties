# Memoria del daemon de Gradle. Con el valor por defecto (512 MB), remapear sam-server y sam-client
# a la vez con Loom agota el heap (OutOfMemoryError) y el build falla o se queda trabado.
# Si vuelve a pasar, el JVM deja un volcado en build/ para diagnosticarlo.
org.gradle.jvmargs=-Xmx2G -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=build/gradle-oom.hprof -Dfile.encoding=UTF-8
