# H-20 (docs/HARDENING.md): análisis estático de seguridad (SAST) con CodeQL en cada push, PR y una vez por semana.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    # Windows: el mismo sistema que el desarrollo (la verificación de dependencias tiene los nativos de Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended
      - name: Compilar
        run: ./gradlew.bat assemble --console=plain
      - uses: github/codeql-action/analyze@v3
