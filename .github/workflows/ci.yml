# H-19/H-18 (docs/HARDENING.md): cada push y PR compila con -Werror, corre las pruebas y JaCoCo, PIT al 100 %
# en sam-common y sam-signer, arma los jars reproducibles con su SHA256SUMS, genera el SBOM (CycloneDX) y busca
# vulnerabilidades conocidas en las dependencias (falla con severidad alta o crítica).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # Windows: el mismo sistema que el desarrollo (la verificación de dependencias tiene los nativos de Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, pruebas y cobertura
        run: ./gradlew.bat build --console=plain
      - name: Pruebas de mutación (PIT 100 %)
        run: ./gradlew.bat :sam-common:pitest :sam-signer:pitest --console=plain
      - name: Jars de release y SHA256SUMS
        run: ./gradlew.bat releaseChecksums --console=plain
      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path: build/release
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
      - name: Vulnerabilidades conocidas en las dependencias
        uses: anchore/scan-action@v7
        with:
          sbom: sbom.cdx.json
          fail-build: true
          severity-cutoff: high
          output-format: table
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            build/release/
            sbom.cdx.json
